name: robottt-local-candidate-docs-v2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/robottt-local-candidate-docs-v2.yml']

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Patch PSM-WMA docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, marker, old, new):
              p=Path(path); s=p.read_text()
              if marker in s:
                  return
              if old not in s:
                  raise SystemExit(f'missing anchor in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          # Proposal
          path='docs/build/PSM-WMA_00_project_proposal_v1.4_frozen.md'
          old='> **2026-08-12 Planner Interface Override**：Local / Global Memory 均定义为**可选信息模态**，与视觉、动作等模态一样按需存在或缺失。当前 Memory 阶段可用训练协议人工控制模态 presence / dropout；后续由更高层 Planner / Reasoner 决定是否请求 Local、是否请求 Global、检索什么以及 token budget，从而为 Agent 留出原生接口。Goal Memory 保留为后续可选 goal-conditioned 扩展，但不再是 Spatial Global Memory 的替代物，也不阻断 Local→Global 主线。\n'
          new=old+'\n> **2026-08-12 Local Mechanism Candidate Addendum**：RoboTTT（arXiv:2607.15275）提升为 **Temporal Local Memory 的第一优先候选机制**，但**不冻结为最终实现**。其价值在于用持续在线更新的 fast-weight recurrent state 压缩长时 visuomotor history，并以 TBPTT 保持长状态链、短梯度链；这与本项目 Local 的 persistent temporal state 目标高度一致。当前同时保留一个更简单的 recurrent latent / fixed-token compressor 作为 baseline candidate。最终选择必须在 `Cosmos3-Edge-Policy-DROID → LIBERO` 的 R06 closed-loop baseline PASS 后，通过 Local 专项 smoke 比较 future/action sensitivity、训练稳定性、状态 reset/并行环境隔离、显存与延迟后再冻结。首选集成方式是**独立 LocalMemoryEncoder/TTT compressor → Local modality tokens → Cosmos3**，而不是首期直接把 TTT layer 植入 Cosmos3 主干。\n'
          patch(path,'Local Mechanism Candidate Addendum',old,new)

          # Survey version note
          path='docs/build/PSM-WMA_01_technical_survey_v1.7_frozen.md'
          old='- **v1.7（2026-08-12）**：在 v1.6 Cosmos-native 路线基础上完成 Memory Injection / Representation 专项收敛。当前主 PSM 拆为两个独立可选模态：Temporal Local Memory（时间对齐的 RGB/视觉、depth、pose、robot state、可选 wrist RGB、executed action 经学习式压缩形成）与 Spatial Global Memory（历史视觉/几何/pose/trajectory/time 经过空间结构化重组与 retrieval，提取关键 patch/key-view/feature）。两者分别使用独立 mapper / modality embedding 接入 Cosmos3 shared MoT；第一版均作为 clean condition，无 decoder、无 memory reconstruction loss。新增 Planner-facing optional-modality interface；评审 Native Memory Modality、Global→Vision Control、zero-gated residual/ControlNet-lite、KV MemoryState 四种注入范式，Native Memory Modality 为当前第一候选，Global→Vision Control 为强备选，Full ControlNet 不优先。补充 LaMem-VLA、ReMem-VLA、μVLA、SERF、VistaVLA、MosaicMem、ControlNet、OminiControl 证据链。\n'
          new=old+'- **v1.7 Local Candidate Addendum（2026-08-12）**：新增 RoboTTT（arXiv:2607.15275）作为 Temporal Local Memory 的第一优先候选机制。RoboTTT 将 fast weights 作为 recurrent state，在训练与推理时通过 TTT-KVB 更新，并用 sequence action forcing + TBPTT 把训练上下文扩展到 8K timesteps（官方约 5 分钟）；这直接支持“固定/受控状态容量 + 长状态链 + 短梯度链”的 Local 方向。但 RoboTTT 原版把 TTT layer 集成进 VLA policy，本项目首选改造成独立 Local temporal compressor/readout，再通过 Local optional modality 接入 Cosmos3。**该选择仍是 Candidate，不是 Frozen**；simple recurrent latent/fixed-token compressor 保留为 baseline，R06 PASS 后再通过 R09-A/B 工程 smoke 决策。\n'
          patch(path,'v1.7 Local Candidate Addendum',old,new)

          old='LaMem-VLA 将短/长期历史重构成 latent memory tokens 并与当前多模态 token 组成同一连续 embedding sequence，支持“memory native latent”方向；ReMem-VLA 与 μVLA 则为 recurrent learned memory 提供直接证据。[69][70][71]\n'
          new='''LaMem-VLA 将短/长期历史重构成 latent memory tokens 并与当前多模态 token 组成同一连续 embedding sequence，支持“memory native latent”方向；ReMem-VLA 与 μVLA 为 recurrent learned memory 提供直接证据。[69][70][71]\n\nRoboTTT 进一步提供了更强的长上下文工程证据：它把一个小模型的 **fast weights** 作为 recurrent state，在每个输入 token 到来时用 TTT-KVB 自监督 key-value binding loss 做在线梯度更新；状态大小不随历史长度线性增长。训练时使用 sequence action forcing 与 TBPTT，在 segment 边界携带但 detach fast-weight state，从而形成“长状态链、短梯度链”。官方报告训练到 8K timesteps（约 5 分钟 @ 30 Hz），并在真实机器人上完成 5 分钟、10-stage assembly。[76]\n\n对 PSM-WMA 的直接启发不是“照搬 RoboTTT 主干改造”，而是把 Temporal Local 的候选实现收敛为两类：\n\n```text\nA. Recurrent Latent / Fixed-token Baseline\naligned multimodal evidence\n→ recurrent query/gated compressor\n→ K_local tokens\n→ Local modality\n\nB. TTT Fast-weight Local (Primary Candidate)\naligned multimodal evidence\n→ per-step summary tokens\n→ TTT fast-weight recurrent state W_t\n→ Local readout\n→ K_local tokens\n→ Local modality\n```\n\nB 当前优先级更高，但只有在 R06 Edge-LIBERO baseline PASS 后，比较 future/action sensitivity、训练稳定性、fast-weight reset/并行环境隔离、FSDP/episode batching、显存与延迟，才允许冻结。首期不把 TTT layer 直接插入 Cosmos3 28 层主干，以避免把 Local 研究变量与 backbone surgery 绑定。\n'''
          patch(path,'RoboTTT 进一步提供了更强的长上下文工程证据',old,new)

          old='[75] Tan et al., **OminiControl: Minimal and Universal Control for Diffusion Transformer**, arXiv:2411.15098. https://arxiv.org/abs/2411.15098  \n'
          new=old+'[76] Jiang et al., **RoboTTT: Context Scaling for Robot Policies**, arXiv:2607.15275. NVIDIA project: https://research.nvidia.com/labs/gear/robottt/ ; paper: https://arxiv.org/abs/2607.15275  \n'
          patch(path,'[76] Jiang et al., **RoboTTT',old,new)

          # Detailed design
          path='docs/build/PSM-WMA_02_detailed_design_v2.1_frozen.md'
          old='''## 5.2 Write / compression\n\n第一候选仍可用 recurrent query / gated cross-attention，但 v2.1 不把具体 recurrence 公式硬冻结。硬约束是：\n- evidence encoder / write / compression / readout 可被 `L_vision + L_action` 优化；\n- 不要求 gradient 穿过完整 episode；\n- R08/R09 比较 truncated BPTT、detached recurrent state、必要时 stable/EMA update，优先保证长时持久状态与训练稳定性；\n- inference persistent state 可持续更新，不因训练截断而限制实际持续时长。\n'''
          new='''## 5.2 Write / compression\n\nLocal 的具体 temporal compressor **尚未冻结**。当前保留两个实现族，其中 TTT fast-weight 路线为第一优先候选、简单 recurrent latent/fixed-token 路线为 baseline candidate：\n\n```text\nBackend A — recurrent_latent (baseline)\naligned evidence E_t\n→ recurrent query / gated compressor\n→ persistent latent state M_t\n→ compact Local tokens\n\nBackend B — ttt_fast_weight (primary candidate)\naligned evidence E_t\n→ per-step summary/register tokens\n→ TTT-KVB fast-weight update W_{t-1} → W_t\n→ Local readout\n→ compact Local tokens\n```\n\nRoboTTT（arXiv:2607.15275）证明 fast weights 可以作为固定大小 recurrent state，在训练/推理时持续更新，并通过 TBPTT 在 segment 边界携带但 detach state，把训练上下文扩展到 8K timesteps。PSM-WMA **不直接冻结 RoboTTT 原版主干内插结构**：首选把 TTT 做成独立 `LocalMemoryEncoder/TemporalCompressor`，输出 Local optional-modality tokens，再经 `local_memory2llm` 接入 Cosmos3。这样不改变 R07 的 modality contract，也避免首期侵入 Cosmos3 shared MoT。\n\n硬约束：\n- evidence encoder / write / compression / readout 可被 `L_vision + L_action` 优化；\n- 不要求 gradient 穿过完整 episode；\n- recurrent/fast-weight state 必须支持 episode reset、并行 env 隔离、segment detach 与 checkpoint/runtime state 明确分离；\n- R08 先解决多源时间对齐；R09-A/B 分别 smoke `recurrent_latent` 与 `ttt_fast_weight`，比较 future/action sensitivity、训练稳定性、显存、延迟与 state-management 成本后再冻结正式 Local backend；\n- inference persistent state 可持续更新，不因训练截断而限制实际持续时长；\n- R06 Edge-LIBERO baseline 未 PASS 前，不实现/优化 TTT Local。\n'''
          patch(path,'Backend B — ttt_fast_weight (primary candidate)',old,new)

          old='''  local:\n    enabled: false\n    optional: true\n    internal_dim: TBD\n    token_budget: TBD\n    history_steps: TBD\n    tbptt_steps: TBD\n    condition_zero_init: true\n'''
          new='''  local:\n    enabled: false\n    optional: true\n    backend: TBD              # recurrent_latent | ttt_fast_weight; R09 后冻结\n    internal_dim: TBD\n    token_budget: TBD\n    history_steps: TBD\n    tbptt_steps: TBD\n    ttt_inner_update: TBD     # only for ttt_fast_weight\n    ttt_segment_steps: TBD    # only for ttt_fast_weight\n    condition_zero_init: true\n'''
          patch(path,'backend: TBD              # recurrent_latent | ttt_fast_weight',old,new)
          patch(path,'Local backend A/B fwd/bwd/intervention + state-management profile','| R09 | Local fwd/bwd/intervention | E002 准入 |','| R09 | Local backend A/B fwd/bwd/intervention + state-management profile | E002 backend 冻结与准入 |')
          patch(path,'R09-A recurrent-latent baseline','R07–R09 + E002 smoke。','R07–R08 后执行 R09-A recurrent-latent baseline 与 R09-B TTT fast-weight candidate smoke，冻结 Local backend 后再做 E002 smoke。')

          # Runtime R09 replacement
          path='docs/build/PSM-WMA_G0_runtime_execution_plan_v0.6_aligned.md'
          old='''# 9. G0-R09 Local PSM Forward/Backward + Intervention Smoke\n\n链路：\n\n```text\nhistory main/wrist RGB + depth + pose + state + executed action\n→ Temporal Alignment\n→ LocalEvidenceEncoder / learned compression\n→ Local state/readout\n→ local_memory2llm\n→ Cosmos3 PackedSequence\n→ native vision/action loss\n```\n\n## 检查\n- M_local `[B,K_local,D_local]`；\n- Z_local `[B,K_local_read,2048]`；\n- all finite；\n- Local evidence/write/read/adapter grads nonzero；\n- recurrent state detach/TBPTT 边界可打印；\n- frozen groups grad zero；\n- Normal/Zero/Shuffle/Stale/Truncated 全能 forward；\n- intervention 保持 token/index/SequencePlan shape；\n- action output 有可测 sensitivity（不要求短 smoke 统计显著）。\n\n## PASS\n可连续跑 100 steps，无 leakage/NaN；intervention contract 全通。\n\n输出：`R09_local_psm_smoke.json`。\n'''
          new='''# 9. G0-R09 Local PSM Backend Selection / Forward-Backward Smoke\n\n> **前置硬条件**：R06 Edge-Policy-LIBERO closed-loop baseline PASS。R06 之前不允许通过 TTT 或任何 Local Memory 改造“救 baseline”。\n\n共享链路：\n\n```text\nhistory main/wrist RGB + depth + pose + state + executed action\n→ Temporal Alignment\n→ LocalEvidenceEncoder\n→ temporal compressor backend\n→ Local state/readout\n→ local_memory2llm\n→ Cosmos3 PackedSequence\n→ native vision/action loss\n```\n\n## R09-A — `recurrent_latent` baseline\n\n```text\naligned E_t\n→ recurrent query / gated latent compressor\n→ M_t / K_local tokens\n```\n\n目标是得到最简单、fixed-budget 的 learned Local baseline，作为“有 learned temporal memory”对照。\n\n## R09-B — `ttt_fast_weight` primary candidate\n\n参考 RoboTTT（arXiv:2607.15275）的原则，但保持 PSM-WMA Local optional-modality 接口：\n\n```text\naligned E_t\n→ per-step summary/register tokens\n→ TTT-KVB fast-weight state W_t\n→ Local readout\n→ K_local tokens\n```\n\n首期 TTT 作为独立 Local temporal compressor，不直接插入 Cosmos3 shared MoT。训练允许 segment 内梯度，segment 边界携带但 detach fast-weight state；推理持续更新 fast weights。\n\n## 两个 backend 都必须检查\n- M_local / backend state / Z_local shape 可追踪；\n- all finite；\n- Local evidence/write/read/adapter grads nonzero；\n- state detach/TBPTT 边界可打印；\n- episode reset 正确；\n- vectorized / multi-env state 无串扰；\n- frozen Cosmos groups grad zero；\n- Normal/Zero/Shuffle/Stale/Truncated 全能 forward；\n- intervention 保持 token/index/SequencePlan shape；\n- **future world 与 action output** 都记录 sensitivity；\n- 记录 peak VRAM、step latency、state bytes、save/load/reset 成本。\n\nTTT 额外检查：\n- fast weights 在同 episode 内实际发生有限更新；\n- segment boundary 后数值 state 连续、autograd graph 已 detach；\n- 新 episode从规定的 W0/reset state 开始；\n- fast weights 不误入模型慢权重 checkpoint/optimizer state 的生命周期；\n- FSDP 多 rank 下 fast-state ownership/shape 一致。\n\n## Backend Freeze Rule\nR09 smoke 不以短跑 SR 决定胜负。先要求两者工程正确，再比较：\n1. future/action sensitivity；\n2. 训练稳定性；\n3. 长状态保持能力；\n4. VRAM/latency；\n5. batching/reset/FSDP 复杂度。\n\n`ttt_fast_weight` 是第一优先候选，但只有综合收益明确时才冻结；否则使用 `recurrent_latent` baseline 进入 E002。\n\n## PASS\n至少 `recurrent_latent` 连续 100 steps 无 leakage/NaN 且 intervention contract 全通；`ttt_fast_weight` 若进入正式候选，必须通过同等 contract + TTT 专项 state assertions。最终输出 backend decision。\n\n输出：`R09_local_backend_selection_smoke.json`。\n'''
          patch(path,'G0-R09 Local PSM Backend Selection',old,new)
          patch(path,'selected backend / history TBPTT-detach or TTT fast-weight policy','Local multi-sensor alignment / history TBPTT-detach policy','Local multi-sensor alignment / selected backend / history TBPTT-detach or TTT fast-weight policy')

          # Static audit
          path='docs/build/PSM-WMA_G0_static_engineering_audit_v0.6_locked.md'
          old='- oVDA 作为 Global geometry source 时同样必须保存 RGB/depth/pose source-index/timestamp 对齐。\n'
          new=old+'- RoboTTT（arXiv:2607.15275）作为 **Temporal Local Memory 第一优先候选机制**，但不是 G0 Foundation 依赖，也未冻结为最终 backend。它提供 fast-weight recurrent state + TTT-KVB + TBPTT 的长上下文证据；项目首选把它封装为独立 Local temporal compressor/readout，而不是首期修改 Cosmos3 shared MoT。简单 `recurrent_latent` backend 必须保留为工程 baseline。\n'
          patch(path,'RoboTTT（arXiv:2607.15275）作为 **Temporal Local Memory 第一优先候选机制**',old,new)
          patch(path,'Local backend（`recurrent_latent` vs `ttt_fast_weight`）','- `K_local/K_goal/K_psm`；','- `K_local/K_global` 以及 Local backend（`recurrent_latent` vs `ttt_fast_weight`）；')
          patch(path,'R09 Local backend A/B fwd/bwd/intervention + backend freeze','→ R09 Local fwd/bwd/intervention','→ R09 Local backend A/B fwd/bwd/intervention + backend freeze')

          # Assertions
          checks={
            'docs/build/PSM-WMA_00_project_proposal_v1.4_frozen.md':['Local Mechanism Candidate Addendum'],
            'docs/build/PSM-WMA_01_technical_survey_v1.7_frozen.md':['RoboTTT 进一步提供了更强的长上下文工程证据','[76] Jiang et al., **RoboTTT'],
            'docs/build/PSM-WMA_02_detailed_design_v2.1_frozen.md':['Backend B — ttt_fast_weight (primary candidate)','ttt_inner_update: TBD'],
            'docs/build/PSM-WMA_G0_runtime_execution_plan_v0.6_aligned.md':['G0-R09 Local PSM Backend Selection','R09-B — `ttt_fast_weight` primary candidate'],
            'docs/build/PSM-WMA_G0_static_engineering_audit_v0.6_locked.md':['RoboTTT（arXiv:2607.15275）作为 **Temporal Local Memory 第一优先候选机制**']
          }
          for fp,markers in checks.items():
              text=Path(fp).read_text()
              for m in markers:
                  assert m in text,(fp,m)
          Path('.github/workflows/robottt-local-candidate-docs-v2.yml').unlink()
          PY
      - name: Commit docs
        shell: bash
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/build .github/workflows/robottt-local-candidate-docs-v2.yml
          git commit -m 'docs: add RoboTTT as Local primary candidate'
          git push
