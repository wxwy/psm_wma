name: docs-hotfix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/docs-hotfix.yml']

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Patch frozen docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {path}: {old[:120]!r}')
                  s = s.replace(old, new)
              p.write_text(s)

          proposal='docs/build/PSM-WMA_00_project_proposal_v1.4_frozen.md'
          patch(proposal, [
            ('其硬承诺覆盖 Local Memory、Goal Memory、PSM→World/Action、RoboCasa365 downstream 收益与最小 Agent vertical slice；**Regional Global PSM / Region-Place Memory 不进入 LIBERO/RoboCasa 12 周硬交付',
             '其硬承诺覆盖 Temporal Local Memory、Spatial Global Memory、PSM→World/Action、RoboCasa365 downstream 收益与最小 Agent vertical slice；**Region/Place 层级化 Regional Global PSM 不进入 LIBERO/RoboCasa 12 周硬交付'),
            ('recurrent persistent state、Local/Goal 分工、shared Memory→World/Action conditioning',
             'recurrent persistent state、Local/Global 分工、independent optional Memory→World/Action conditioning'),
            ('1. **Local persistent world state**：固定容量、递归更新、task-agnostic；\n2. **Goal-conditioned long-history state**：与 Local 分责，保存当前任务真正需要的历史/进度；\n3. **Shared Memory → World / Action interface**：同一 persistent state 真正进入 action-conditioned world representation 与在线 action；\n4. **Memory injection topology**：先验证低风险 shared conditioning，再评估是否需要更深的模型内部持续状态接入；\n5. **可归因系统闭环**：通过 Local/Goal intervention、future/action 与 closed-loop 结果证明真实作用。',
             '1. **Temporal Local persistent state**：固定/受控容量地压缩近期时间对齐的多源经历，学习内容提取、更新与读取；\n2. **Spatial Global persistent state**：把全 episode 历史按空间位置、相机轨迹、视角、时间与语义结构化，并按需检索关键空间证据；\n3. **Independent optional modality interfaces**：Local / Global 分别适配到统一 World/Action 主干，允许按需存在或缺失；\n4. **Shared Memory → World / Action interface**：两类 Memory 都必须真实影响 action-conditioned world representation 与在线 action；\n5. **可归因系统闭环**：通过 Local/Global intervention、future/action sensitivity 与 closed-loop 结果证明真实作用。'),
            ('Continuous Observation\n        ↓\nLocal Memory\n        +\nGoal Memory\n        ↓\nAction-conditioned World State',
             'Continuous Observation\n        ↓\nTemporal Local Memory (optional)\n        +\nSpatial Global Memory (optional)\n        ↓\nAction-conditioned World State'),
            ('New Observation → Memory Update', 'New Observation → Local update / Global store update'),
            ('通过干预证明 Local Memory、Goal Memory、WAM 与 Agent 各自提供可重复收益',
             '通过干预证明 Temporal Local Memory、Spatial Global Memory、WAM 与 Agent 各自提供可重复收益'),
            ('建立 Local/Goal intervention 与 no-regression / memory-dependent benchmark 体系；',
             '建立 Local/Global intervention 与 no-regression / memory-dependent benchmark 体系；'),
            ('1. **Baseline / Local Memory / Intervention**：先证明“会记、会更新、会用”；\n2. **RoboCasa365 Local + WAM**：验证 memory-conditioned world/action 是否形成执行收益；\n3. **Goal Memory**：验证 goal-relevant long history / task progress 与 Local 的互补；\n4. **Agent / BEHAVIOR / Regional / Continual**：只在前序 Go 条件满足后使用剩余预算。',
             '1. **Baseline / Temporal Local / Intervention**：先证明 learned temporal state“会压缩、会更新、会用”；\n2. **Spatial Global / Retrieval / Intervention**：验证结构化空间历史与关键视角检索是否形成额外 world/action 收益；\n3. **RoboCasa365 Local/Global + WAM**：验证双模态 memory-conditioned world/action 的 downstream 执行价值；\n4. **Planner/Agent / Goal Memory Target / BEHAVIOR Regional / Continual**：只在前序 Go 条件满足后使用剩余预算。'),
            ('LIBERO:\nLocal Memory\n\n        ↓\n\nRoboCasa365:\nLocal Memory\n+ action-conditioned World/Action\n+ Goal Memory\n\n        ↓\n\nAgent thin slice',
             'LIBERO:\nTemporal Local Memory\n→ Spatial Global Memory\n→ Local/Global matched attribution\n\n        ↓\n\nRoboCasa365:\nTemporal Local + Spatial Global\n+ action-conditioned World/Action\n\n        ↓\n\nPlanner/Agent thin slice\n(+ Goal Memory only if task-progress gap is proven)')
          ])

          survey='docs/build/PSM-WMA_01_technical_survey_v1.7_frozen.md'
          patch(survey, [
            ('| Goal Memory（LIBERO/RoboCasa） | **提升为当前主线** | 当前两类环境无需区域化即可验证长期历史、任务进度、out-of-view recall 与 Memory→World/Action；优先用一份 goal-conditioned fixed-budget memory，避免提前引入 place recognition / writer / reader。 |',
             '| Spatial Global Memory（LIBERO/RoboCasa） | **提升为当前主线** | 当前不要求 Region/Place 层级化，但可以验证全 episode 历史按空间/视角/时间重组后的关键证据检索，以及 Global→World/Action 的独立收益；Goal Memory 降为 task-progress gap 明确时才启用的 Target。 |'),
            ('| Intervention | Local: Zero/Shuffle/Stale/Truncated；Goal: Zero/Shuffle；Regional Wrong-region 延后 | **必须** | 防止强 backbone 绕过 Memory，并区分 Local/Goal 职责 | 无 |',
             '| Intervention | Local: Zero/Shuffle/Stale/Truncated；Global: Zero/Shuffle/Wrong-view/Stale/Top-K truncation；`absent` 与 `present+zero` 分离 | **必须** | 防止强 backbone 绕过 Memory，并区分 Temporal Local / Spatial Global 职责 | 无 |'),
            ('PSM-WMA 的研究变量是 Persistent Spatial / Goal Memory，而不是重新发明 Action Head 或从零训练世界模型。',
             'PSM-WMA 的研究变量是 Temporal Local Memory + Spatial Global Memory，以及二者如何作为独立可选条件进入统一 World/Action 主干，而不是重新发明 Action Head 或从零训练世界模型。'),
            ('Local/Goal summary + observation + goal\n→ Cosmos3 Reasoner\n→ structured subgoal/verifier\n→ feed next Generator query',
             'observation + goal + compact memory metadata/summary\n→ Cosmos3 Reasoner\n→ structured MemoryRequest / subgoal / verifier\n→ Local/Global routing & retrieval\n→ feed next Generator query')
          ])

          design='docs/build/PSM-WMA_02_detailed_design_v2.1_frozen.md'
          patch(design, [
            ('│   │       ├── observation_adapter.py\n│   │       ├── action_interval_encoder.py\n│   │       ├── local_memory.py\n│   │       ├── goal_memory.py\n│   │       ├── condition_adapter.py\n│   │       └── reasoner_readout.py',
             '│   │       ├── observation_adapter.py\n│   │       ├── temporal_alignment.py\n│   │       ├── action_interval_encoder.py\n│   │       ├── local_memory.py\n│   │       ├── local_memory_adapter.py\n│   │       ├── global_spatial_store.py\n│   │       ├── global_retrieval.py\n│   │       ├── global_spatial_adapter.py\n│   │       └── reasoner_readout.py'),
            ('psm:\n  enabled: false\n  internal_dim: 1024\n  local_tokens: 16\n  goal_tokens: 8\n  read_tokens: 2\n  condition_zero_init: true\n  history_steps: TBD\n  tbptt_steps: TBD\n\nreasoner:\n  enabled: false\n  trigger_mode: event\n  structured_output: true',
             'psm:\n  enabled: false\n\n  local:\n    enabled: false\n    optional: true\n    internal_dim: TBD\n    token_budget: TBD\n    history_steps: TBD\n    tbptt_steps: TBD\n    condition_zero_init: true\n\n  global:\n    enabled: false\n    optional: true\n    token_budget: TBD\n    retrieval_topk: TBD\n    condition_zero_init: true\n\n  modality_dropout:\n    local: TBD\n    global: TBD\n\nreasoner:\n  enabled: false\n  trigger_mode: event\n  structured_output: true\n  controls_memory_presence: false  # Planner/Agent phase only'),
            ('obs/source index\nexecuted action range\nLocal update\nGoal update/reset\nPSM packed indexes\nSequencePlan clean/noisy indexes\naction/future outputs\nReasoner trigger/result',
             'obs/source index + multi-sensor timestamp alignment\nexecuted action range\nLocal update/read + detach/TBPTT boundary\nGlobal store write + retrieval top-k + source/provenance\nLocal/Global modality presence (absent vs present+zero)\nLocal/Global packed indexes\nSequencePlan clean/noisy indexes\naction/future outputs\nReasoner trigger/MemoryRequest/result')
          ])

          static='docs/build/PSM-WMA_G0_static_engineering_audit_v0.6_locked.md'
          patch(static, [
            ('## 3.2 `sequence_packing/types.py` / `modality.py` / `sequence.py`\n\n静态确认：\n- `SequencePlan.has_vision/has_action/has_sound`；\n- `condition_frame_indexes_*`；\n- `ModalityData.sequence_indexes`；\n- `mse_loss_indexes`；\n- `condition_mask`；\n- `noisy_frame_indexes`；\n- Action `domain_id/raw_action_dim`。\n\n因此“一次 forward 输出什么”由数据/plan 显式定义，不是模型根据输入自动 router。',
             '## 3.2 `sequence_packing` 实际 import / runtime 路径\n\n当前固定 submodule commit `5d6dedc7...` 的 package-level 入口为：\n\n```text\nsequence_packing/__init__.py\n├── ModalityData        ← modality.py\n├── PackedSequence      ← sequence.py\n├── SequencePlan        ← sequence.py\n├── build_sequence_plans_from_data_batch ← sequence.py\n└── pack_input_sequence ← packers.py\n```\n\n仓库中同时存在 `types.py` 的较旧/兼容定义；**不得因为文件名相似就默认修改 `types.py` 会影响运行路径**。任何 R07 Memory 扩展必须从实际调用点沿 import 链确认唯一生效对象，并同时审计 `packers.py`、`sequence.py`、`modality.py`、mRoPE/attention/runtime 相关代码。\n\n静态确认仍包括 `SequencePlan.has_vision/has_action/has_sound`、`condition_frame_indexes_*`、`ModalityData.sequence_indexes`、`mse_loss_indexes`、`condition_mask`、`noisy_frame_indexes` 以及 Action `domain_id/raw_action_dim`。因此“一次 forward 输出什么”由数据/plan 显式定义，不是模型根据输入自动 router。')
          ])

          runtime='docs/build/PSM-WMA_G0_runtime_execution_plan_v0.6_aligned.md'
          patch(runtime, [
            ('## 目的\n在不实现真实 Memory 算法前，用 dummy Local / Global tensors 验证 Cosmos3 能把二者作为独立、可选、always-clean modality。\n\n## 最小对象',
             '## 目的\n在不实现真实 Memory 算法前，用 dummy Local / Global tensors 验证 Cosmos3 能把二者作为独立、可选、always-clean modality。\n\n## 运行路径前置核对\n\n先记录当前 submodule commit，并从真实调用点确认 `sequence_packing` import/runtime 链。对当前固定 commit `5d6dedc7...`，package-level export 为 `__init__.py → packers.py / sequence.py / modality.py`；仓库中并存的 `types.py` 不得未经 import 追踪就作为修改目标。R07 实现前必须输出实际 class/function 的 `__module__`、源码路径与 import trace，并把 `packers.py`、position/mRoPE、attention mask 与 FSDP graph 一并纳入 smoke。\n\n## 最小对象')
          ])

          wf=Path('.github/workflows/docs-hotfix.yml')
          wf.unlink()
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/build .github/workflows/docs-hotfix.yml
          git commit -m 'docs: align Local/Global modality architecture'
          git push
